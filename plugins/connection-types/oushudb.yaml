schemaVersion: 1
order: 431
dbType: oushudb
compareModes: [schema, data]
transferSupportLevel: family-compatible
transferObjectFamily: postgres
rustVariant: Oushudb
label: OushuDB
dialect: PostgreSQL
# OushuDB 走 PostgreSQL wire protocol，由 dbx-driver-postgres（tokio-postgres）
# 原生驱动连接，随安装包分发，不再依赖外部 JDBC 插件与厂商 jar。
# @author xiaogui
# @since 2026-11-25 12:49:01
runtimeMode: native
mcpMode: direct
singleConnectionPool: false
metadataConnectionScoped: false
skipTcpProbe: false
defaultPort: 5432
traits:
  schemaAware: true
  clearableQuerySchema: true
  treeSchema: true
  pgVacuum: true
  pgLikeStructure: true
  diagramSql: true
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: true
  sqlExplain: false
  userAdmin: true
  driverManagement: false
